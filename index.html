<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const uid=()=>Math.random().toString(36).slice(2,9);
const SHARE=(()=>{try{const q=new URLSearchParams(location.search),t=q.get('share'),s=q.get('s');if(t&&/^[A-Za-z0-9]{8,64}$/.test(t)&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(s||''))return{t,s}}catch(e){}return null})();
let db=SHARE?{people:{},updated:0}:(JSON.parse(localStorage.gp||'null')||{people:{},updated:0});
try{ // liên kết mời: ?s=<địa chỉ /exec>&c=<Client ID>; phải có đủ cả hai để token đăng nhập không gửi nhầm tới máy chủ lạ
  const q=new URLSearchParams(location.search),s=q.get('s'),c=q.get('c');
  if(!SHARE&&(s||c)){history.replaceState(null,'',location.pathname);
    if(s&&c&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(s)&&/^[\w.-]+\.apps\.googleusercontent\.com$/.test(c)){
      const same=localStorage.gpurl==s&&localStorage.gpcid==c,had=localStorage.gpurl||localStorage.gpcid;
      if(same||!had||confirm('Liên kết này sẽ đặt máy chủ gia phả của app thành:\n'+s+'\nChỉ đồng ý nếu liên kết do quản trị viên dòng họ gửi. Tiếp tục?')){localStorage.gpurl=s;localStorage.gpcid=c}}
    else setTimeout(()=>alert('Liên kết mời không hợp lệ hoặc thiếu thông tin, hãy nhờ quản trị viên gửi lại.'),300)}
}catch(e){}
const CFG={url:'',cid:''}; // quản trị viên có thể điền sẵn địa chỉ máy chủ và Client ID tại đây
const SRV=()=>SHARE?SHARE.s:(CFG.url||localStorage.gpurl||''),CID=()=>CFG.cid||localStorage.gpcid||'';
const ROLE={share:'Bản chia sẻ (chỉ xem)','quan-tri':'Quản trị viên','de-xuat':'Thành viên (xem, gửi đề xuất sửa)','xem':'Chỉ xem'};
let v=['list','tree','ev','cal'].includes(localStorage.gpstart)?localStorage.gpstart:'list',mt,pt,idt=SHARE?'':sessionStorage.gpt||'',role=SHARE?'share':SRV()?'':'local',rev=0,queue=[],members={},me='',deny='',offline=false,logs=[],inst=null,contact={},exportMap={},perm={},notify={admin:true,member:true,url:''},vmap={},defs={role:'de-xuat',contact:false,export:false},remind={on:false,lead:3,who:'admin'},remindMe=true,isOwner=false,bks=null,snap0=null,shares=[],shareName='';

if(role===''&&!navigator.onLine&&localStorage.gprole){role='xem';offline=true}

const spIds=p=>[...new Set([p.sid,...String(p.xs||'').split(',')].map(x=>String(x||'').trim()).filter(x=>x&&x!=p.id&&P()[x]))];

  const p=P()[id],now=new Set(spIds(p));

  for(const n of now){const q=P()[n];if(spIds(q).includes(id))continue;if(!q.sid)q.sid=id;else q.xs=[...String(q.xs||'').split(',').filter(Boolean),id].join(',')}}

  for(const p of Object.values(P()))for(const n of spIds(p)){const q=P()[n];if(spIds(q).includes(p.id))continue;if(!q.sid)q.sid=p.id;else q.xs=[...String(q.xs||'').split(',').filter(Boolean),p.id].join(',')}}

/* ---------- Âm lịch (thuật toán Hồ Ngọc Đức, múi giờ +7) ---------- */
const TZ=7,PI=Math.PI,INT=Math.floor,pad=n=>String(n).padStart(2,'0');
function jd(d,m,y){const a=INT((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+INT((153*M+2)/5)+365*Y+INT(Y/4)-INT(Y/100)+INT(Y/400)-32045}
function jdd(j){const a=j+32044,b=INT((4*a+3)/146097),c=a-INT(b*146097/4),d=INT((4*c+3)/1461),e=c-INT(1461*d/4),m=INT((5*e+2)/153);return[e-INT((153*m+2)/5)+1,m+3-12*INT(m/10),b*100+d-4800+INT(m/10)]}
function nm(k){const T=k/1236.85,T2=T*T,T3=T2*T,r=PI/180,S=x=>Math.sin(x*r);
  const J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3+0.00033*S(166.56+132.87*T-0.009173*T2);
  const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  const C=(0.1734-0.000393*T)*S(M)+0.0021*S(2*M)-0.4068*S(Mp)+0.0161*S(2*Mp)-0.0004*S(3*Mp)+0.0104*S(2*F)-0.0051*S(M+Mp)-0.0074*S(M-Mp)+0.0004*S(2*F+M)-0.0004*S(2*F-M)-0.0006*S(2*F+Mp)+0.001*S(2*F-Mp)+0.0005*S(2*Mp+M);
  const dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
  return INT(J+C-dt+.5+TZ/24)}
function sl(j){const T=(j-2451545.5-TZ/24)/36525,T2=T*T,r=PI/180,M=357.5291+35999.0503*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;
  const DL=(1.9146-0.004817*T-0.000014*T2)*Math.sin(r*M)+(0.019993-0.000101*T)*Math.sin(r*2*M)+0.00029*Math.sin(r*3*M);
  let L=(L0+DL)*r;L-=PI*2*INT(L/(PI*2));return INT(L/PI*6)}
function m11(y){const k=INT((jd(31,12,y)-2415021)/29.530588853);let n=nm(k);if(sl(n)>=9)n=nm(k-1);return n}
function leapOff(a){const k=INT((a-2415021.076998695)/29.530588853+.5);let last,i=1,arc=sl(nm(k+i));do{last=arc;i++;arc=sl(nm(k+i))}while(arc!=last&&i<14);return i-1}
function s2l(d,m,y){
  const dn=jd(d,m,y),k=INT((dn-2415021.076998695)/29.530588853);let ms=nm(k+1);if(ms>dn)ms=nm(k);
  let a=m11(y),b=a,ly;if(a>=ms){ly=y;a=m11(y-1)}else{ly=y+1;b=m11(y+1)}
  const df=INT((ms-a)/29);let lm=df+11,lp=0;
  if(b-a>365){const lo=leapOff(a);if(df>=lo){lm=df+10;if(df==lo)lp=1}}
  if(lm>12)lm-=12;if(lm>=11&&df<4)ly--;return[dn-ms+1,lm,ly,lp]}
function l2s(d,m,y,lp){
  let a,b;if(m<11){a=m11(y-1);b=m11(y)}else{a=m11(y);b=m11(y+1)}
  const k=INT(.5+(a-2415021.076998695)/29.530588853);let off=m-11;if(off<0)off+=12;
  if(b-a>365){const lo=leapOff(a);let lm=lo-2;if(lm<0)lm+=12;if(lp&&m!=lm)return null;if(lp||off>=lo)off++}
  return jdd(nm(k+off)+d-1)}
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const fmt=(d,m,y)=>`${pad(d)}/${pad(m)}/${y}`;
const pd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?[+s.slice(8),+s.slice(5,7),+s.slice(0,4)]:null;
const lun=(d,m,y)=>{const l=s2l(d,m,y);return l[0]+'/'+l[1]+(l[3]?' nhuận':'')};
const vn=s=>{const x=pd(s);if(x)return fmt(...x);const m=String(s||'').match(/^(\d{4})-(\d\d)$/);return m?`${m[2]}/${m[1]}`:s||''};
const dual=s=>{const x=pd(s);return x?`${fmt(...x)} (âm lịch ${lun(...x)})`:esc(vn(s))};

const okDate=x=>{if(!x)return true;const m=x.match(/^(\d{4})(?:-(\d\d)(?:-(\d\d))?)?$/);if(!m)return false;
  const y=+m[1],mo=m[2]?+m[2]:1,d=m[3]?+m[3]:1;return y>=1000&&y<=2200&&mo>=1&&mo<=12&&d>=1&&d<=new Date(y,mo,0).getDate()};
const liveInfo=p=>isD(p)?'':[p.rs&&`<p><small>Nơi ở hiện tại</small>${esc(p.rs)}</p>`,p.wp&&`<p><small>Nơi làm việc, học tập</small>${esc(p.wp)}</p>`,p.tel&&`<p><small>Điện thoại</small><a href="tel:${esc(p.tel)}">${esc(p.tel)}</a></p>`,p.mail&&`<p><small>Email</small><a href="mailto:${esc(p.mail)}">${esc(p.mail)}</a></p>`,p.ct&&`<p><small>Liên hệ khác</small>${esc(p.ct)}</p>`].filter(Boolean).join('');
const bday=(b,y)=>b[1]==2&&b[0]==29&&new Date(y,2,0).getDate()<29?[28,2,y]:[b[0],b[1],y];
const today=()=>{const t=new Date();return[t.getDate(),t.getMonth()+1,t.getFullYear()]};
function gioDM(p){if(p.gd&&p.gm)return[+p.gd,+p.gm];const x=pd(p.d);if(!x)return null;const l=s2l(...x);return[l[0],l[1]]}
function nextGio(p,T){
  const g=gioDM(p);if(!g)return null;const tj=jd(...T),ly=s2l(...T)[2];
  for(const y of [ly,ly+1]){let s=l2s(g[0],g[1],y,0);if(!s)continue;if(s2l(...s)[0]!=g[0])s=jdd(jd(...s)-1);const j=jd(...s);if(j>=tj)return{j,s}}
  return null}
function gioLine(p){
  const g=gioDM(p);if(!g)return '';const n=nextGio(p,today());
  return `<p class="giỗ"><small>Ngày giỗ</small>${g[0]}/${g[1]} âm lịch${n?`, sắp tới <a data-a="cal" data-i="${n.s[2]}-${n.s[1]}-${n.s[0]}">${WD[(n.j+1)%7]} ${fmt(...n.s)} dương lịch</a>`:''}</p>`}

/* ---------- Xuất lịch .ics (nhập vào Google Calendar, Apple Lịch, Outlook) ---------- */
const ie=t=>String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\n/g,'\\n');
const ymd=([d,m,y])=>`${y}${pad(m)}${pad(d)}`;
function ics(){
  const T=today(),tj=jd(...T),ly=s2l(...T)[2],now=new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),
    o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gia pha//VI','CALSCALE:GREGORIAN','X-WR-CALNAME:Gia phả'];
  const ev=(uid,date,sum,desc,al,rule)=>{
    o.push('BEGIN:VEVENT',`UID:${uid}@giapha`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${ymd(date)}`,`DTEND;VALUE=DATE:${ymd(jdd(jd(...date)+1))}`,...(rule?['RRULE:'+rule]:[]),`SUMMARY:${ie(sum)}`,`DESCRIPTION:${ie(desc)}`);
    for(const t of al)o.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ie(sum)}`,`TRIGGER:${t}`,'END:VALARM');
    o.push('END:VEVENT')};
  for(const p of Object.values(P())){
    const b=pd(p.b);
    if(b&&!isD(p)){const dsc=`Sinh ngày ${fmt(...b)} (âm lịch ${lun(...b)})`;
      if(b[1]==2&&b[0]==29){for(let y=T[2];y<T[2]+10;y++){const s=bday(b,y);if(jd(...s)>=tj)ev(`sn-${p.id}-${y}`,s,'Sinh nhật '+p.name,dsc,['-PT15H'])}}
      else{let y=T[2],j=jd(b[0],b[1],y);if(j<tj)j=jd(b[0],b[1],++y);ev('sn-'+p.id,jdd(j),'Sinh nhật '+p.name,dsc,['-PT15H'],'FREQ=YEARLY')}}
    const g=gioDM(p);
    if(g)for(let y=ly;y<ly+10;y++){
      let d=l2s(g[0],g[1],y,0);if(!d)continue;if(s2l(...d)[0]!=g[0])d=jdd(jd(...d)-1);if(jd(...d)<tj)continue;
      const dy=+yr(p.d),n=dy?d[2]-dy:0;
      ev(`gio-${p.id}-${d[2]}`,d,'Giỗ '+p.name,`Ngày giỗ ${g[0]}/${g[1]} âm lịch${p.d?', mất '+vn(p.d):''}${n>0?', '+n+' năm':''}`,['-P6DT15H','-PT15H'])}
  }
  return o.concat('END:VCALENDAR').join('\r\n')}

/* ---------- Xưng hô (theo cách gọi miền Bắc, so tuổi theo năm sinh) ---------- */
const NG=['cháu','chắt','chút','chít'],bs=t=>t.replace(/ \(.*/,'').replace(/ họ$/,'');
function ancs(id){
  const m=new Map([[id,{d:0,path:''}]]);let fr=[id];
  for(let d=1;d<12&&fr.length;d++){const nx=[];
    for(const x of fr){const q=P()[x],e=m.get(x);
      for(const [k,c] of [[q.fid,'f'],[q.mid,'m']])if(k&&P()[k]&&!m.has(k)){m.set(k,{d,path:e.path+c});nx.push(k)}}
    fr=nx}
  return m}
function blood(a,b){
  if(a.id==b.id)return 'chính người này';
  const A=ancs(a.id),B=ancs(b.id);let best=null;
  for(const [k,x] of A){const y=B.get(k);if(y&&(!best||x.d+y.d<best.da+best.db))best={da:x.d,db:y.d,pa:x.path,pb:y.path}}
  if(!best)return null;
  const {da,db,pa,pb}=best,male=b.g!='f',yb=+yr(b.b),ya=+yr(a.b),old=yb&&ya&&yb!=ya?yb<ya:null,side=c=>c=='f'?'nội':'ngoại';
  if(da==0){if(db==1)return male?'con trai':'con gái';if(db==2)return 'cháu '+side(pb[0]);return NG[db-2]||'hậu duệ đời '+db}
  if(db==0){if(da==1)return male?'cha':'mẹ';if(da==2)return (male?'ông ':'bà ')+side(pa[0]);if(da==3)return (male?'cụ ông ':'cụ bà ')+side(pa[0]);if(da==4)return male?'kỵ ông':'kỵ bà';return 'tổ tiên đời thứ '+da+' phía trên'}
  if(da==db){
    if(da==1){const full=a.fid&&a.fid==b.fid&&a.mid&&a.mid==b.mid,t=old==null?(male?'anh hoặc em trai':'chị hoặc em gái'):old?(male?'anh':'chị'):(male?'em trai':'em gái');return t+(full?'':' (cùng cha hoặc cùng mẹ)')}
    return (old==null?'anh/chị/em':old?(male?'anh':'chị'):'em')+' họ'+(da>2?' (họ xa)':'')}
  if(da<db){const d=db-da;return 'cháu'+(da>1?' họ':'')+(da==1&&d==1?' (con của anh/chị/em)':d>1?' (thấp hơn '+d+' đời)':'')}
  const d=da-db,h=db>1?' họ':'';
  if(d==1){const par=P()[pa[0]=='f'?a.fid:a.mid],yp=par?+yr(par.b):0,o=yb&&yp&&yb!=yp?yb<yp:null;
    if(pa[0]=='f')return (o==null?(male?'bác/chú':'bác/cô'):o?'bác':male?'chú':'cô')+h;
    return (o==null?(male?'bác/cậu':'bác/dì'):o?'bác':male?'cậu':'dì')+h}
  if(d==2)return (male?'ông (anh/em của ông bà)':'bà (chị/em của ông bà)')+h;
  return 'họ hàng bậc trên '+d+' đời'}
const inlaw=(t,sa)=>{const suf=sa.g=='f'?'vợ':'chồng',k=bs(t);
  if(k=='cha')return 'bố '+suf;if(k=='mẹ')return 'mẹ '+suf;
  const w=k.split(' ')[0];if(['anh','chị','em'].includes(w)&&!/họ/.test(t))return w+' '+suf;
  return t+' (bên '+suf+')'};
const spouseOf=(t,b)=>{const k=bs(t),M={'chú':'thím','cậu':'mợ','bác':'bác','cô':'dượng','dì':'dượng','em trai':'em dâu','em gái':'em rể','anh':'chị dâu','chị':'anh rể','con trai':'con dâu','con gái':'con rể'};
  if(M[k])return M[k];const m=k.match(/^(ông|bà) (nội|ngoại)$/);if(m)return (m[1]=='ông'?'bà ':'ông ')+m[2];
  return (b.g=='f'?'vợ':'chồng')+' của '+t.replace(/ \(.*/,'')};
function rel(a,b){
  const bl=blood(a,b);if(bl)return bl;
  const SA=spo(a),SB=spo(b);
  if(SA.some(x=>x.id==b.id))return b.g=='f'?'vợ':'chồng';
  for(const sa of SA){const t=blood(sa,b);if(t)return inlaw(t,sa)}
  for(const sb of SB){const t=blood(a,sb);if(t)return spouseOf(t,b)}
  return 'chưa xác định (chưa nối được quan hệ trong gia phả)'}

const PAL=['#2c4a6b','#a3302a','#2f7d5b','#8a6d1d','#6b4a8a','#1f7a8c','#8a4b2c','#5f6e76'],EX=new Set();
const cc=n=>PAL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const cd=(p,d,col)=>`<div class="nd ${p.g}${isD(p)?' dead':''}"${col?` style="border-top-color:${col}"`:''} data-a="view" data-i="${p.id}">${av(p)}<b>${esc(p.name)}</b><small>${life(p)}</small>${d?`<small>Đời ${d}</small>`:''}</div>`;
const ks=(p,vis)=>{return [...new Map([...kids(p.id),...spo(p).flatMap(s=>kids(s.id).filter(k=>{const o=k.fid==s.id?k.mid:k.fid;return !o||o==p.id}))].map(k=>[k.id,k])).values()].filter(k=>!vis.has(k.id)).sort(byBirth)};
const cnt=(p,vis)=>{vis.add(p.id);spo(p).forEach(s=>vis.add(s.id));let n=0;for(const k of ks(p,vis)){if(vis.has(k.id))continue;n+=1+cnt(k,vis)}return n};
function vTree(){
  const ps=Object.values(P());if(!ps.length)return '<p class="empty">Thêm người để xem cây gia phả.</p>';
  const r=P()[localStorage.gpr]||ps.find(p=>!p.fid&&!p.mid&&kids(p.id).length)||ps[0],lim=+localStorage.gpl||0,seen=new Set();
  const node=(p,d,col)=>{seen.add(p.id);const S=spo(p);S.forEach(s=>seen.add(s.id));
    const all=ks(p,seen),open=!lim||d<lim||EX.has(p.id);
    return `<li><div class="pair">${cd(p,d,col)}${S.map(s=>cd(s,d,'')).join('')}</div>${all.length?(open?'<ul>'+all.map((k,i)=>node(k,d+1,k.chi?cc(k.chi):d==1?PAL[i%PAL.length]:col)).join('')+'</ul>':`<button class="more" data-a="exp" data-i="${p.id}">+${cnt(p,new Set(seen))} con cháu</button>`):''}</li>`};
  const top=ks(r,new Set([r.id,...spo(r).map(x=>x.id)])),rc=r.chi?cc(r.chi):'';
  const chips=top.map((k,i)=>{const c=k.chi?cc(k.chi):PAL[i%PAL.length];return `<button class="chip" data-a="root" data-i="${k.id}" style="border-color:${c}"><i style="background:${c}"></i>${esc(k.chi||'Nhánh '+k.name)}</button>`}).join('');
  const tree=`<ul>${node(r,1,rc)}</ul>`;

function vEv(){

/* ---------- Kiểm tra dữ liệu bất thường ---------- */
function checks(){
  const ps=Object.values(P()),out=[],Y=p=>+yr(p.b)||0,D=p=>+yr(p.d)||0,now=new Date().getFullYear(),dup={};
  const add=(p,t,m)=>out.push({id:p.id,t,m});
  for(const p of ps){
    if(p.cf=='nv')add(p,'luuy','Thông tin được đánh dấu nghi vấn, cần kiểm tra thêm'+(p.src?` (nguồn: ${p.src})`:''));
    for(const [k,lb,gd] of [['fid','Cha','m'],['mid','Mẹ','f']]){
      const q=P()[p[k]],l=lb.toLowerCase();
      if(p[k]&&!q){add(p,'loi',`${lb} không còn trong gia phả`);continue}
      if(!q)continue;
      if(q.g!=gd)add(p,'loi',`${lb} (${q.name}) đang ghi giới tính ${q.g=='f'?'nữ':'nam'}`);
      if(ancs(q.id).has(p.id))add(p,'loi',`Vòng lặp quan hệ: ${p.name} vừa là con vừa là tổ tiên của ${l} (${q.name})`);
      const by=Y(p),qy=Y(q);
      if(by&&qy){const a=by-qy;
        if(a<0)add(p,'loi',`Sinh năm ${by}, trước ${l} (${q.name}, sinh năm ${qy})`);
        else if(a<14)add(p,'luu',`${lb} (${q.name}) mới ${a} tuổi khi sinh ${p.name}`);
        else if(a>(gd=='f'?50:80))add(p,'luu',`${lb} (${q.name}) đã ${a} tuổi khi sinh ${p.name}`)}
      const qd=D(q);
      if(by&&qd&&(gd=='f'?by>qd:by>qd+1))add(p,'loi',`Sinh năm ${by}, sau khi ${l} (${q.name}) mất năm ${qd}`)}
    if(Y(p)&&D(p)){const a=D(p)-Y(p);if(a<0)add(p,'loi',`Mất năm ${D(p)}, trước khi sinh năm ${Y(p)}`);else if(a>110)add(p,'luu',`Thọ ${a} tuổi, hãy kiểm tra lại năm sinh và năm mất`)}
    if(Y(p)>now)add(p,'loi',`Năm sinh ${Y(p)} nằm trong tương lai`);
    if(Y(p)&&!isD(p)&&now-Y(p)>110)add(p,'luu',`Sinh năm ${Y(p)} nhưng chưa đánh dấu đã mất`);
    for(const x of spAll(p)){const sp=P()[x];
      if(!sp)add(p,'loi','Vợ/chồng không còn trong gia phả');
      else if(!spIds(sp).includes(p.id))add(p,'luu',`Quan hệ vợ/chồng với ${sp.name} chưa ghi nhận hai chiều`)}
    if(Y(p))(dup[norm(p.name)+'|'+Y(p)]=dup[norm(p.name)+'|'+Y(p)]||[]).push(p)}
  for(const k in dup)if(dup[k].length>1)dup[k].forEach(p=>add(p,'luu',`Có thể trùng với ${dup[k].filter(x=>x!=p).map(x=>x.name).join(', ')} (cùng tên và năm sinh)`));
  return out}

function showPoster(o,pos,p){

    pgs.append(pg)}
  for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++){

async function addDocs(id,files){

function cleanDb(d){const o={people:{},updated:Date.now()};
  for(const [k,p] of Object.entries(d.people||{})){if(!p||typeof p!='object'||!SID.test(k)||!p.name)continue;const q={};
    for(const f in p)if(typeof p[f]=='string')q[f]=p[f].slice(0,500);
    q.id=k;q.name=String(p.name).slice(0,200);q.g=p.g=='f'?'f':'m';
    for(const f of ['b','d'])if(!okDate(q[f]||''))q[f]='';
    for(const f of ['fid','mid','sid'])if(q[f]&&!SID.test(q[f]))q[f]='';
    if(q.ph&&!okImg(q.ph))q.ph='';
    if(Array.isArray(p.fl))q.fl=p.fl.filter(f=>f&&SID.test(f.id)&&FT.includes(f.type)).slice(0,100).map(f=>({id:f.id,name:String(f.name||'').slice(0,120),type:f.type,size:+f.size||0,sent:f.sent?1:0}));
    if(Array.isArray(p.al))q.al=p.al.filter(a=>a&&SID.test(a.id)&&okImg(a.t)).slice(0,200).map(a=>({id:a.id,t:a.t,cap:String(a.cap||'').slice(0,300),yr:String(a.yr||'').slice(0,10),sent:a.sent?1:0}));
    o.people[k]=q}
  for(const p of Object.values(o.people)){for(const f of ['fid','mid','sid'])if(p[f]&&(!o.people[p[f]]||p[f]==p.id))p[f]='';p.xs=String(p.xs||'').split(',').filter(x=>x&&x!=p.id&&o.people[x]).join(',')}
  return o}
function nd(x){x=String(x||'').trim();let m=x.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m=x.match(/^(\d{1,2})[\/.\-](\d{4})$/);if(m)return `${m[2]}-${pad(m[1])}`;
  m=x.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);return m?`${m[1]}-${pad(m[2])}-${pad(m[3])}`:x}
async function xlsxIn(file){
  if(!canEdit())return msg('Bạn không có quyền nhập dữ liệu');
  if(!window.XLSX)return msg('Chưa tải được thư viện Excel, kiểm tra mạng');
  let rows;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true,codepage:65001});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false,dateNF:'yyyy-mm-dd'})}catch(e){return msg('Không đọc được tệp Excel')}
  const R=rows.map(r=>{const o={};for(const k in r){const f=XF[norm(k).replace(/[^a-z0-9]/g,'')];if(f)o[f]=String(r[k]==null?'':r[k]).trim()}return o}).filter(o=>o.name);
  if(!R.length)return msg('Không thấy dòng nào có cột "Họ và tên"');
  const ids=new Set(),byName={};let add=0,upd=0,miss=0;
  R.forEach(o=>{if(!o.id||!SID.test(o.id)||ids.has(o.id))o.id=uid();ids.add(o.id);P()[o.id]?upd++:add++});
  const addName=(n,id)=>{n=norm(n);(byName[n]=byName[n]||[]).push(id)};
  Object.values(P()).forEach(q=>addName(q.name,q.id));R.forEach(o=>{if(!P()[o.id])addName(o.name,o.id)});
  const rel=(id,nm,self)=>{if(id&&id!=self&&(P()[id]||ids.has(id)))return id;
    if(!nm){if(id)miss++;return ''}const l=byName[norm(nm)];if(l&&l.length==1&&l[0]!=self)return l[0];miss++;return ''};
  if(!confirm(`Nhập ${R.length} dòng: ${add} thêm mới, ${upd} cập nhật. Tiếp tục?`))return;
  const n=x=>{const v=parseInt(x);return v>0?String(v):''};
  R.forEach(o=>{const old=P()[o.id]||{},kp=k=>o[k]!==undefined?o[k]:(old[k]||''),dd=nd(o.d);
    P()[o.id]={...old,id:o.id,name:o.name,g:/^(nu|f)/.test(norm(o.g||''))?'f':'m',b:nd(o.b),d:dd,dead:dd||(o.dead!==undefined?/^(co|x|1|y|t)/.test(norm(o.dead)):old.dead)?'1':'',bp:kp('bp'),rs:kp('rs'),tel:kp('tel'),mail:kp('mail'),ct:kp('ct'),bur:kp('bur'),job:kp('job'),edu:kp('edu'),wp:kp('wp'),hu:kp('hu'),tu:kp('tu'),th:kp('th'),bd:kp('bd'),src:kp('src'),cf:o.cf!==undefined?(/^nghi/.test(norm(o.cf))?'nv':/^chua/.test(norm(o.cf))?'kc':''):(old.cf||''),gd:n(o.gd),gm:n(o.gm),pl:o.pl||'',note:o.note||'',
      fid:rel(o.fid,o.fn,o.id),mid:rel(o.mid,o.mn,o.id),sid:rel(o.sid,o.sn,o.id),xs:o.xs!==undefined?o.xs.split(/[,;|]/).map(x=>x.trim()).filter(Boolean).map(x=>rel(x,'',o.id)).filter(Boolean).join(','):(old.xs||'')}});
  normSp();
  save();msg(`Đã nhập ${R.length} người`+(miss?`, ${miss} quan hệ không xác định được`:''))}

    if(p.fid||p.mid){const f=fam(fk(p.fid,p.mid));[p.fid,p.mid].forEach(x=>x&&!f.m.includes(x)&&f.m.push(x));f.c.push(p.id)}});

  const l=dupPairs(),card=p=>`<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><small>${[life(p),esc(p.pl)].filter(Boolean).join(', ')||'Chưa có ngày sinh'}</small><small>Cha: ${esc((P()[p.fid]||{}).name||'không rõ')}; Mẹ: ${esc((P()[p.mid]||{}).name||'không rõ')}</small><small>${kids(p.id).length} con</small></div>`;
  return `<div class="bar noprint"><button data-a="tab" data-i="set">‹ Dữ liệu</button></div><h2>Tìm người trùng (${l.length})</h2>
  <small style="margin-bottom:8px">Gợi ý các cặp cùng tên, giới tính và năm sinh gần nhau. Khi gộp, thông tin còn thiếu của người được giữ sẽ lấy từ người kia, mọi quan hệ cha mẹ, con, vợ chồng và ảnh được chuyển sang người được giữ.</small>`
  +(l.map(([a,b,w])=>`<div class="row" style="cursor:default;flex-wrap:wrap;align-items:flex-start"><div style="flex:1 1 100%"><span class="tag">${w}</span></div>${card(a)}${card(b)}
    <div class="act" style="flex:1 1 100%;margin:4px 0 0"><button data-a="mrg" data-i="${a.id}:${b.id}">Giữ ${esc(a.name.split(' ').slice(-1)[0])} (trái)</button><button data-a="mrg" data-i="${b.id}:${a.id}">Giữ bên phải</button><button data-a="nodup" data-i="${pairKey(a,b)}">Không trùng</button></div></div>`).join('')||'<p class="empty">Không phát hiện cặp nào có thể trùng.</p>')}

/* ---------- Gộp thay đổi khi hai quản trị viên sửa cùng lúc ---------- */
function merge3(b,l,sv){
  const B=b.people||{},L=l.people||{},S=sv.people||{},out={people:{},updated:Date.now()};let conf=0;
  for(const id of new Set([...Object.keys(B),...Object.keys(L),...Object.keys(S)])){
    const bb=B[id],ll=L[id],ss=S[id],js=JSON.stringify,lch=js(ll)!=js(bb),sch=js(ss)!=js(bb);
    if(!lch){if(ss)out.people[id]=ss;continue}
    if(!sch){if(ll)out.people[id]=ll;continue}
    if(!ll||!ss){out.people[id]=ll||ss;conf++;continue}
    const m={...ss};
    for(const k of new Set([...Object.keys(ll),...Object.keys(ss),...Object.keys(bb||{})])){
      const lv=js(ll[k]),svv=js(ss[k]),bv=js((bb||{})[k]);
      if(lv!=bv&&svv==bv){if(ll[k]===undefined)delete m[k];else m[k]=ll[k]}
      else if(lv!=bv&&svv!=bv&&lv!=svv){conf++;if(ll[k]===undefined)delete m[k];else m[k]=ll[k]}}
    out.people[id]=m}
  for(const p of Object.values(out.people)){for(const f of ['fid','mid','sid'])if(p[f]&&!out.people[p[f]])p[f]='';if(p.xs)p.xs=p.xs.split(',').filter(x=>x&&x!=p.id&&out.people[x]).join(',')}
  return {db:out,conf}}

/* ---------- Máy chủ (Google Apps Script, dữ liệu nằm trong Drive của quản trị viên) ---------- */
const fail=e=>{console.error(e);msg(e&&e.err=='denied'?'Bạn không có quyền thực hiện thao tác này':'Lỗi kết nối máy chủ, thử lại sau')};
async function api(a,x={}){
  const r=await fetch(SRV(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({t:idt,a,...x})});
  const j=await r.json();
  if(j.err=='auth'){idt='';sessionStorage.removeItem('gpt');role='';deny='Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.';render();throw j}
  return j}
async function boot(){
  try{const r=await api('load');
    if(r.err=='denied'){role='';deny='Tài khoản '+jwtMail()+' chưa được quản trị viên mời. Hãy nhờ quản trị viên thêm email này.';return render()}
    if(r.err){role='';deny='Lỗi: '+r.err;return render()}
    const local=db;role=r.role;me=r.me;rev=r.rev;db=r.db;snap0=JSON.stringify(r.db);queue=r.queue||[];members=r.members||{};contact=r.contact||{};exportMap=r.exports||{};perm=r.perm||{};if(r.notify)notify=r.notify;vmap=r.vis||{};if(r.defaults)defs=r.defaults;if(r.remind)remind=r.remind;shares=r.shares||[];remindMe=r.remindMe!==false;isOwner=!!r.owner;
    if(role=='quan-tri'&&!Object.keys(db.people).length&&Object.keys(local.people).length&&confirm('Máy chủ còn trống. Đưa '+Object.keys(local.people).length+' người đang có trên máy này lên máy chủ?')){db=local;await pushNow()}
    if(role=='quan-tri'&&localStorage.gpdirty&&(local.updated||0)>(db.updated||0)&&Object.keys(local.people).length){
      if(confirm('Máy này có thay đổi chưa được lưu lên máy chủ (do mất mạng hoặc phiên đăng nhập hết hạn).\n\nOK: dùng bản trên máy này và lưu lên máy chủ (ghi đè bản trên máy chủ).\nHuỷ: bỏ thay đổi này và dùng bản trên máy chủ.')){db=local;await pushNow()}else localStorage.removeItem('gpdirty')}
    else localStorage.removeItem('gpdirty');
    localStorage.gp=JSON.stringify(db);localStorage.gprole=role;offline=false;render();if(role=='quan-tri')flushImgs().catch(fail)
  }catch(e){if(e&&e.err=='auth')return;if(localStorage.gprole){role='xem';offline=true;try{db=JSON.parse(localStorage.gp)}catch(x){}render()}else fail(e)}}
async function memOp(x){
  try{const r=await api('member',x);if(r.err){msg('Không lưu được phân quyền: '+r.err);return boot()}members=r.members;contact=r.contact;exportMap=r.exports||{};render();msg('Đã lưu phân quyền')}catch(e){if(!e||e.err!='auth')fail(e)}}
async function pushNow(tries=0){
  msg('Đang lưu…');const r=await api('save',{rev,db});
  if(r.err=='conflict'){
    if(!snap0||tries>=3){msg('Dữ liệu vừa được thay đổi ở nơi khác, đang tải lại…');return boot()}
    const sv=await api('load');if(sv.err||!sv.db){msg('Dữ liệu vừa được thay đổi ở nơi khác, đang tải lại…');return boot()}
    const mg=merge3(JSON.parse(snap0),db,sv.db);db=mg.db;rev=sv.rev;queue=sv.queue||queue;snap0=JSON.stringify(sv.db);normSp();localStorage.gp=JSON.stringify(db);render();
    await pushNow(tries+1);if(mg.conf)msg(`Đã gộp thay đổi của người khác với bản của bạn (${mg.conf} chỗ khác nhau, ưu tiên bản của bạn)`);return}
  if(r.err)throw r;rev=r.rev;snap0=JSON.stringify(db);localStorage.removeItem('gpdirty');msg('Đã lưu vào Drive của quản trị viên')}
function drivePush(){if(role!='quan-tri'||!idt)return;clearTimeout(pt);pt=setTimeout(()=>pushNow().then(flushImgs).catch(fail),1200)}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(v=='set')render()});
window.addEventListener('online',()=>{if(offline)location.reload()});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SHARE){api('shared',{token:SHARE.t}).then(r=>{if(r.err){role='';deny=r.err;return render()}db={people:r.people,updated:0};shareName=r.name;render()}).catch(()=>{role='';deny='Không tải được bản chia sẻ, hãy thử lại sau.';render()})}
else{render();msg();if(SRV()&&idt)boot()}
</script>
